# Runs the end-to-end test in the Safari engine (WebKit) and Chrome engine (Chromium)
# at iPad and iPhone sizes on every upload, then saves the screenshots to the
# "test-shots" branch so they can be looked at.
name: Browser test
on:
  push:
    branches-ignore: [test-shots]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps webkit chromium
      - name: Start a local web server that compresses files like GitHub Pages
        run: (node tests/server.mjs . 8080 &) && sleep 3
      - name: Run the test
        # A virtual screen, so the browsers get a (software) graphics chip for the face finder.
        run: HEADED=1 xvfb-run -a node tests/e2e.mjs http://localhost:8080/ test-shots webkit,chromium
      - name: Save screenshots to the test-shots branch
        if: always()
        run: |
          cd test-shots
          git init -q -b test-shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" test-shots
